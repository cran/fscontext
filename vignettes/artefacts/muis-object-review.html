<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuIS heritage object review</title>
<style>
* { box-sizing:border-box; }
:root { --border:#d8d8d8; --muted:#666; --header:#f5f5f5;
        --green:#dff2df; --yellow:#fff2b8; --red:#ffd6d6; }
body { margin:0; background:#fff; color:#202124; font-family:Roboto,Arial,sans-serif; font-size:14px; }
main { padding:28px 32px 40px; }
h1 { margin:0 0 8px; font-size:24px; font-weight:500; }
.intro { max-width:1000px; line-height:1.5; color:#444; margin-bottom:20px; }

/* Browser/page is the only horizontal scrolling surface. */
html, body { overflow:visible; }

/* The page may grow to the full width required by the review table. */
main { width:100%; min-width:0; }

/* No internal horizontal scrolling. */
.scroll-top { display:none; }
.table-wrap { overflow:visible; width:max-content; }

table { border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
th,td { border-right:1px solid var(--border); border-bottom:1px solid var(--border);
        padding:10px; vertical-align:top; text-align:left; background:#fff; }

/* Header row stays visible during vertical page scrolling. */
th { background:var(--header); font-weight:500; white-space:nowrap;
     position:sticky; top:0; z-index:2; }

tr:first-child th { border-top:1px solid var(--border); }
th:first-child,td:first-child { border-left:1px solid var(--border); }

/* Exactly the first two columns are sticky horizontally. */
th:nth-child(1), td:nth-child(1) {
  position:sticky;
  left:32px;
  z-index:3;
}
th:nth-child(2), td:nth-child(2) {
  position:sticky;
  left:78px;
  z-index:3;
  box-shadow:2px 0 3px rgba(0,0,0,.08);
}

/* Top-left two cells are sticky in both axes. */
th:nth-child(1), th:nth-child(2) {
  background:var(--header);
  z-index:5;
}
td:nth-child(1), td:nth-child(2) {
  background:#fff;
}

.num { width:46px; min-width:46px; text-align:right; color:var(--muted); }
.evidence { width:190px; min-width:190px; }
.evidence img { display:block; max-width:165px; max-height:130px; object-fit:contain; }
.media-id { margin-top:6px; font-size:12px; color:var(--muted); }
.label { width:230px; min-width:230px; }
.description { width:300px; min-width:300px; }
.evidence-description{width:285px;min-width:285px}
.relation{width:175px;min-width:175px}
.subject { width:245px; min-width:245px; }
.predicate-cell,.heritage-cell { width:230px; min-width:230px; }
.finalise-cell,.finalise-head { width:78px; min-width:78px; text-align:center; }
.context,.context-head { width:260px; min-width:260px; }
.context { background:#fafafa; color:#444; line-height:1.4; }
.context-head small { display:block; font-weight:400; color:var(--muted); margin-top:3px; }
.text-input,.subject-input,select,.write-in,textarea {
  width:100%; padding:7px; border:1px solid #c9c9c9; border-radius:3px;
  background:#fff; font:inherit;
}
textarea { min-height:78px; resize:vertical; line-height:1.4; }
.write-in { display:none; margin-top:7px; }
.entity-link { display:inline-block; padding:7px 8px; border:1px solid #c9c9c9; border-radius:3px;
               color:#174ea6; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
.create-item { margin-top:7px; padding:5px 8px; border:1px solid #999; border-radius:3px;
               background:#fff; cursor:pointer; font:inherit; }
.definition-link { display:inline-block; margin-top:8px; color:#3c4043; font-size:12px; }
.definition-link::after { content:" ↗"; }
.qualify { display:flex; gap:10px; margin-top:8px; }
.qualify button { border:0; background:transparent; padding:0; color:#555;
                  text-decoration:underline; cursor:pointer; font:inherit; }
.semantic-cell[data-qualification="defer"] { background:var(--yellow); }
.semantic-cell[data-qualification="reject"] { background:var(--red); }
tr[data-finalised="true"] .semantic-cell[data-qualification="none"] { background:var(--green); }
.finalise-control { position:relative; display:inline-flex; }
.finalise-check { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
.finalise-check:focus-visible + .finalise-mark { outline:2px solid #174ea6; outline-offset:2px; }
.finalise-mark { width:28px; height:28px; border:1px solid #aaa; border-radius:4px;
                 display:inline-flex; align-items:center; justify-content:center;
                 background:#fff; font-size:19px; font-weight:700; cursor:pointer; }
tr[data-finalised="true"][data-outcome="accept"] .finalise-mark {
  background:var(--green); border-color:#6e9d6e; color:#276427;
}
tr[data-finalised="true"][data-outcome="defer"] .finalise-mark {
  background:var(--yellow); border-color:#c6a33a; color:#7a6200;
}
tr[data-finalised="true"][data-outcome="reject"] .finalise-mark {
  background:var(--red); border-color:#c66; color:#9a2020;
}
.predicate-heading { display:flex; flex-direction:column; gap:3px; }
.predicate-heading small { font-weight:400; color:var(--muted); }
.footer { margin-top:18px; display:flex; gap:14px; align-items:center; }
.footer button { padding:8px 14px; border:1px solid #999; border-radius:3px; background:#fff; cursor:pointer; }
#summary { color:var(--muted); }

.review-header{max-width:920px;margin:0 0 22px}.instructions{margin:0 0 8px;line-height:1.5;color:#444}
.review-about{margin:0;font-size:13px}.review-about a{color:#174ea6;text-underline-offset:2px}
.review-meta{max-width:920px;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.review-meta h2{margin:0 0 10px;font-size:15px;font-weight:500}.reviewer-bottom{display:flex;flex-wrap:wrap;gap:14px 20px}
.reviewer-bottom label{display:grid;gap:4px;color:var(--muted);font-size:12px}.reviewer-bottom input{min-width:240px;padding:7px;border:1px solid var(--border);border-radius:3px;font:inherit}
.project-id-input{min-width:120px!important;width:140px}
.save-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.save-actions button{padding:8px 14px;border:1px solid #888;border-radius:3px;background:#fff;cursor:pointer;font:inherit}
#save-final{font-weight:600;border-color:#555}.save-status{margin-top:9px;min-height:18px;color:var(--muted);font-size:12px}
.site-footer{max-width:920px;margin-top:20px;padding-top:12px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
<header class="review-header">
<h1>MuIS heritage object review</h1>
<p class="instructions">Review the candidate classification of each heritage object.</p>
</header>
<div class="table-wrap">
<table id="review-table"><thead><tr><th class="num">#</th><th>Evidence</th><th>Label</th><th>Description</th><th>Heritage object</th><th>object type</th><th class="finalise-head">Finalise</th></tr></thead><tbody><tr data-row="1" data-finalised="false" data-outcome="accept"><td class="num">1</td><td class="evidence"><a href="https://www.muis.ee/digitaalhoidla/api/meedia/pisipilt?id=ebc07930-f719-44f2-a108-6698bcecc20b" target="_blank" rel="noopener"><img src="https://www.muis.ee/digitaalhoidla/api/meedia/pisipilt?id=ebc07930-f719-44f2-a108-6698bcecc20b" alt="Evidence sweater, women's"></a><div class="media-id">sweater, women's</div></td><td class="label"><input class="text-input" value="sweater, women's"></td><td class="description"><textarea>Heritage object described by MuIS record 635780</textarea></td><td class="semantic-cell" data-qualification="none"><input class="subject-input" type="text" value="https://www.muis.ee/museaalview/635780"><button type="button" class="create-item">Create new item</button><div class="qualify"><button data-qualify="defer">Defer</button><button data-qualify="reject">Reject</button></div></td><td class="semantic-cell" data-qualification="none"><select class="candidate-select"><option value="sweaters" selected>sweaters</option><option value="gloves">gloves</option><option value="shirts">shirts</option><option value="__other__">Other…</option></select><input class="write-in" placeholder="Enter another value"><a class="definition-link" href="object type" target="_blank" rel="noopener">Definition</a><div class="qualify"><button data-qualify="defer">Defer</button><button data-qualify="reject">Reject</button></div></td><td class="finalise-cell"><label class="finalise-control"><input type="checkbox" class="finalise-check"><span class="finalise-mark"></span></label></td></tr>
<tr data-row="2" data-finalised="false" data-outcome="accept"><td class="num">2</td><td class="evidence"><a href="https://www.muis.ee/digitaalhoidla/api/meedia/pisipilt?id=6440f24f-eaad-4cd4-84d7-1ae7a9d44d5a" target="_blank" rel="noopener"><img src="https://www.muis.ee/digitaalhoidla/api/meedia/pisipilt?id=6440f24f-eaad-4cd4-84d7-1ae7a9d44d5a" alt="Evidence gloves"></a><div class="media-id">gloves</div></td><td class="label"><input class="text-input" value="gloves"></td><td class="description"><textarea>Heritage object described by MuIS record 633053</textarea></td><td class="semantic-cell" data-qualification="none"><input class="subject-input" type="text" value="https://www.muis.ee/museaalview/633053"><button type="button" class="create-item">Create new item</button><div class="qualify"><button data-qualify="defer">Defer</button><button data-qualify="reject">Reject</button></div></td><td class="semantic-cell" data-qualification="none"><select class="candidate-select"><option value="sweaters">sweaters</option><option value="gloves" selected>gloves</option><option value="shirts">shirts</option><option value="__other__">Other…</option></select><input class="write-in" placeholder="Enter another value"><a class="definition-link" href="object type" target="_blank" rel="noopener">Definition</a><div class="qualify"><button data-qualify="defer">Defer</button><button data-qualify="reject">Reject</button></div></td><td class="finalise-cell"><label class="finalise-control"><input type="checkbox" class="finalise-check"><span class="finalise-mark"></span></label></td></tr>
<tr data-row="3" data-finalised="false" data-outcome="accept"><td class="num">3</td><td class="evidence"><a href="https://www.muis.ee/digitaalhoidla/api/meedia/pisipilt?id=826c402e-c130-4860-b11e-9538bd403ecf" target="_blank" rel="noopener"><img src="https://www.muis.ee/digitaalhoidla/api/meedia/pisipilt?id=826c402e-c130-4860-b11e-9538bd403ecf" alt="Evidence shirt, women's"></a><div class="media-id">shirt, women's</div></td><td class="label"><input class="text-input" value="shirt, women's"></td><td class="description"><textarea>Heritage object described by MuIS record 635778</textarea></td><td class="semantic-cell" data-qualification="none"><input class="subject-input" type="text" value="https://www.muis.ee/museaalview/635778"><button type="button" class="create-item">Create new item</button><div class="qualify"><button data-qualify="defer">Defer</button><button data-qualify="reject">Reject</button></div></td><td class="semantic-cell" data-qualification="none"><select class="candidate-select"><option value="sweaters">sweaters</option><option value="gloves">gloves</option><option value="shirts" selected>shirts</option><option value="__other__">Other…</option></select><input class="write-in" placeholder="Enter another value"><a class="definition-link" href="object type" target="_blank" rel="noopener">Definition</a><div class="qualify"><button data-qualify="defer">Defer</button><button data-qualify="reject">Reject</button></div></td><td class="finalise-cell"><label class="finalise-control"><input type="checkbox" class="finalise-check"><span class="finalise-mark"></span></label></td></tr></tbody></table>
</div>
<div class="footer">
<span id="summary"></span>
</div>
<section class="review-meta">
<h2>Review metadata</h2>
<div class="reviewer-bottom">
<label>Reviewer<input id="reviewer-name" type="text"></label>
<label>Reviewer email<input id="reviewer-email" type="email"></label>
<label>Project ID<input id="project-id" class="project-id-input" type="text" value="muis-example" readonly></label>
<label>Sequence<input id="review-sequence" type="number" value="0" readonly></label>
<label>Started at<input id="review-started-at" type="text" readonly></label>
<label>Last saved at<input id="review-last-saved-at" type="text" readonly></label>
<label>Ended at<input id="review-ended-at" type="text" readonly></label>
<label>Status<input id="review-status" type="text" value="in-progress" readonly></label>
</div>
<input id="filename-stem" type="hidden" value="muis-object-review">
<div class="save-actions">
<button id="save-draft" type="button">Save draft</button>
<button id="save-final" type="button">Finalise review</button>
</div>
<div id="save-status" class="save-status"></div>
</section>
<footer class="site-footer">Betwixt semantic review</footer>
</main>
<script>
(() => {
  const rows = [...document.querySelectorAll("tbody tr")];

  function outcome(row) {
    const cells = [...row.querySelectorAll(".semantic-cell")];

    if (cells.some(cell => cell.dataset.qualification === "reject")) {
      return "reject";
    }

    if (cells.some(cell => cell.dataset.qualification === "defer")) {
      return "defer";
    }

    return "accept";
  }

  function paint(row) {
    row.dataset.outcome = outcome(row);

    const mark = row.querySelector(".finalise-mark");

    if (row.dataset.finalised !== "true") {
      mark.textContent = "";
      return;
    }

    if (row.dataset.outcome === "reject") {
      mark.textContent = "×";
    } else if (row.dataset.outcome === "defer") {
      mark.textContent = "○";
    } else {
      mark.textContent = "✓";
    }
  }

  function summary() {
    const finalised = rows.filter(
      row => row.dataset.finalised === "true"
    ).length;

    const deferred = document.querySelectorAll(
      '.semantic-cell[data-qualification="defer"]'
    ).length;

    const rejected = document.querySelectorAll(
      '.semantic-cell[data-qualification="reject"]'
    ).length;

    document.getElementById("summary").textContent =
      `${finalised} finalised · ${deferred} deferred cells · ` +
      `${rejected} rejected cells`;
  }

  function qualify(cell, state) {
    cell.dataset.qualification = state;
    paint(cell.closest("tr"));
    summary();
  }

  rows.forEach(row => {
    row.querySelectorAll("[data-qualify]").forEach(button => {
      button.addEventListener("click", () => {
        const cell = button.closest(".semantic-cell");
        const qualification = button.dataset.qualify;
        const current = cell.dataset.qualification;

        qualify(
          cell,
          current === qualification ? "none" : qualification
        );
      });
    });

    row.querySelectorAll(".candidate-select").forEach(select => {
      const cell = select.closest(".semantic-cell");
      const writeIn = cell.querySelector(".write-in");

      const updateWriteIn = () => {
        const show = select.value === "__other__";

        writeIn.style.display = show ? "block" : "none";

        if (!show) {
          writeIn.value = "";
        }

        if (show) {
          writeIn.focus();
        }
      };

      select.addEventListener("change", updateWriteIn);
      updateWriteIn();
    });

    const check = row.querySelector(".finalise-check");

    check.addEventListener("change", () => {
      row.dataset.finalised = check.checked ? "true" : "false";
      paint(row);
      summary();
    });

    const create = row.querySelector(".create-item");

    if (create) {
      create.addEventListener("click", () => {
        const cell = create.closest(".semantic-cell");
        const input = cell.querySelector(".subject-input");

        cell.innerHTML =
          `<a class="entity-link" href="#">` +
          `fuds:QNEW${row.dataset.row}</a>` +
          `<div style="margin-top:6px;font-size:12px;color:#666">` +
          `Prototype registration for “${input.value}”</div>` +
          `<div class="qualify">` +
          `<button data-qualify="defer">Defer</button>` +
          `<button data-qualify="reject">Reject</button>` +
          `</div>`;

        cell.querySelectorAll("[data-qualify]").forEach(button => {
          button.addEventListener("click", () => {
            const qualification = button.dataset.qualify;
            const current = cell.dataset.qualification;

            qualify(
              cell,
              current === qualification ? "none" : qualification
            );
          });
        });
      });
    }
  });

  rows.forEach(paint);
  summary();

  const startedAt = document.getElementById("review-started-at");

  if (startedAt && !startedAt.value) {
    startedAt.value = new Date().toISOString();
  }

  function persistStateIntoClone(clone) {
    const sourceInputs = [...document.querySelectorAll("input")];
    const clonedInputs = [...clone.querySelectorAll("input")];

    sourceInputs.forEach((source, index) => {
      const target = clonedInputs[index];

      if (!target) {
        return;
      }

      target.setAttribute("value", source.value);

      if (source.type === "checkbox") {
        if (source.checked) {
          target.setAttribute("checked", "");
        } else {
          target.removeAttribute("checked");
        }
      }
    });

    const sourceTextareas = [...document.querySelectorAll("textarea")];
    const clonedTextareas = [...clone.querySelectorAll("textarea")];

    sourceTextareas.forEach((source, index) => {
      if (clonedTextareas[index]) {
        clonedTextareas[index].textContent = source.value;
      }
    });

    const sourceSelects = [...document.querySelectorAll("select")];
    const clonedSelects = [...clone.querySelectorAll("select")];

    sourceSelects.forEach((source, index) => {
      const target = clonedSelects[index];

      if (!target) {
        return;
      }

      [...target.options].forEach(option => {
        if (option.value === source.value) {
          option.setAttribute("selected", "");
        } else {
          option.removeAttribute("selected");
        }
      });
    });

    const sourceCells = [
      ...document.querySelectorAll(".semantic-cell")
    ];
    const clonedCells = [
      ...clone.querySelectorAll(".semantic-cell")
    ];

    sourceCells.forEach((source, index) => {
      if (clonedCells[index]) {
        clonedCells[index].dataset.qualification =
          source.dataset.qualification;
      }
    });

    const sourceRows = [...document.querySelectorAll("tbody tr")];
    const clonedRows = [...clone.querySelectorAll("tbody tr")];

    sourceRows.forEach((source, index) => {
      const target = clonedRows[index];

      if (!target) {
        return;
      }

      target.dataset.finalised =
        source.dataset.finalised || "false";

      target.dataset.outcome =
        source.dataset.outcome || "accept";
    });
  }

  function saveReview(finaliseReview) {
    const now = new Date().toISOString();
    const sequenceInput =
      document.getElementById("review-sequence");

    const filenameStem =
      document.getElementById("filename-stem").value.trim() ||
      "betwixt-review";

    let sequence = Number(sequenceInput.value || 0);

    // The first browser save starts review sequence 1.
    if (sequence === 0) {
      sequence = 1;
      sequenceInput.value = sequence;
    }

    document.getElementById("review-last-saved-at").value = now;

    document.getElementById("review-status").value =
      finaliseReview ? "finalised" : "in-progress";

    if (finaliseReview) {
      document.getElementById("review-ended-at").value = now;
    }

    // Preserve the updated state in the downloaded HTML.
    const clone = document.documentElement.cloneNode(true);
    persistStateIntoClone(clone);

    // Draft and finalised files belong to the same review sequence.
    const stem = `${filenameStem}_${sequence}`;
    const suffix = finaliseReview ? "-finalised" : "-draft";
    const filename = `${stem}${suffix}.html`;

    const blob = new Blob(
      ["<!doctype html>\n" + clone.outerHTML],
      { type: "text/html;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);

    document.getElementById("save-status").textContent =
      (finaliseReview
        ? "Finalised review saved at "
        : "Draft saved at ") + now;
  }

  document
    .getElementById("save-draft")
    .addEventListener("click", () => saveReview(false));

  document
    .getElementById("save-final")
    .addEventListener("click", () => saveReview(true));
})();

</script>
</body>
</html>
